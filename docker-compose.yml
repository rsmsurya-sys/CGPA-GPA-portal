services:
  # Python FastAPI REST API Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cgpa-fastapi-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/cgpa_portal_db
      - JWT_SECRET=super_secret_jwt_key_forsaken_academic_portal_2026_xyz
      - JWT_ALGORITHM=HS256
      - CORS_ORIGINS=*
    depends_on:
      - postgres
    networks:
      - cgpa-network

  # PostgreSQL Relational SQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cgpa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cgpa_portal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cgpa-network

volumes:
  postgres-data:
    driver: local

networks:
  cgpa-network:
    driver: bridge
