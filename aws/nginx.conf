# Nginx Reverse Proxy Configuration for AWS EC2
# Place in: /etc/nginx/sites-available/cgpa-api
# Enable with: sudo ln -s /etc/nginx/sites-available/cgpa-api /etc/nginx/sites-enabled/
# Test with: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Forward API requests to FastAPI Uvicorn server
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
}
